# Server messages — sent to the connected Minecraft client (boss bar / action bar)
# Placeholders use {0}, {1}, ... (java.text.MessageFormat)

server.selection.enabled=Selection mode ENABLED. Left-click sets pos1, right-click sets pos2.
server.selection.disabled=Selection mode disabled.
server.selection.off=Selection mode is off. Use /{0} area-selection first.
server.selection.usage=Usage: /{0} <area-selection|schematic-export|pos1|pos2|fly>
server.selection.unknown_subcommand=Unknown subcommand ''{0}''.
server.selection.pos1_set=pos1 set: {0}
server.selection.pos2_set=pos2 set: {0}
server.selection.bbox=Selection: {0}
server.selection.waiting=Waiting for new selection...  LMB=pos1, RMB=pos2
server.selection.particle_pos1=Pos1: {0} {1} {2}
server.selection.particle_pos2=Pos2: {0} {1} {2}
server.selection.particle_separator=  |  

server.fly.enabled=Fly mode ENABLED. You can fly freely; server position is frozen.
server.fly.disabled=Fly mode disabled. Restored game mode.

server.export.no_selection=No selection to export - set both pos1 and pos2 first.
server.export.wrong_dimension=Selection was made in a different dimension. Switch back or make a new selection.
server.export.busy=An export is already in progress, please wait...
server.export.started=Exporting schematic ({0})...
server.export.success=Schematic exported: {0} ({1})
server.export.incomplete=Warning: {0} block(s) were in unloaded chunks (treated as air), {1} head(s) had no skin data. {2} block entity/entities were exported.
server.export.failed_io=Export failed: {0}
server.export.failed_generic=Export failed: {0}: {1}
server.export.failed_no_file=Export failed: file was not created ({0})
server.export.failed_empty_file=Export failed: file is empty ({0})
server.export.failed_verify=Export failed: could not verify file ({0})
